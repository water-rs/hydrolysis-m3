name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  bump:
    # release-plz bump pull requests (`release-plz-*` heads) change only
    # versions and the changelog, so this job skips itself and every other
    # job skips through `needs: bump`.
    name: Not a release bump
    if: ${{ !startsWith(github.head_ref, 'release-plz-') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME} is not a release bump"

  check:
    name: Check / ${{ matrix.os }}
    needs: bump
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Hydrolysis renders through Vulkan only on Linux; the runner has no
      # GPU, so Mesa's lavapipe driver and the Vulkan loader stand in for one.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libva-dev libpipewire-0.3-dev libegl-dev libgbm-dev libwayland-dev libxkbcommon-dev libvulkan-dev mesa-vulkan-drivers libvulkan1 spirv-tools
      - name: Install DirectX Shader Compiler
        if: runner.os == 'Windows'
        # The framework's install-dxc restores the compiler from the Actions
        # cache, so a warm run downloads nothing (water-rs/waterui#3942).
        uses: water-rs/waterui/.github/actions/install-dxc@dev
      - name: Install SPIRV-Tools
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-spirv-tools
      - name: Put SPIRV-Tools on the PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      # Hydrolysis's styled tests resolve their font families through
      # system font discovery; the fonts are built from pinned,
      # hash-verified sources by the install script of the pinned waterui.
      - name: Locate the Hydrolysis test-font script
        id: test-fonts
        shell: bash
        run: |
          set -euo pipefail
          script="$(cargo metadata --format-version 1 --locked | jq -er '.packages[] | select(.name == "hydrolysis") | .manifest_path | sub("Cargo.toml$"; "test-fonts/install.py")')"
          {
            echo "script=$script"
            echo "dir=$(dirname "$script")"
            echo "hash=$(uv run --no-project python -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$script")"
          } >> "$GITHUB_OUTPUT"
      # The script builds its fonts beside itself and reuses every face it
      # finds there after checking it against its pinned digest, so a
      # restored entry downloads nothing. The script's hash covers every
      # source pin and expected digest.
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.test-fonts.outputs.dir }}/*.ttf
            ${{ steps.test-fonts.outputs.dir }}/*.otf
          key: test-fonts-v1-${{ runner.os }}-${{ steps.test-fonts.outputs.hash }}
      - name: Install Hydrolysis test fonts
        shell: bash
        # Fetches the GitHub-hosted sources as authenticated traffic.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run "${{ steps.test-fonts.outputs.script }}"
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --locked --profile ci
      - run: cargo test --locked --doc

  msrv:
    name: MSRV
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The floor is whatever `Cargo.toml` declares, read here rather than
      # written twice: a hardcoded version in CI drifts from the manifest and
      # then gates a number nobody declared.
      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Installing a toolchain is not building with it: the action only
          # sets the rustup default, and this repository's
          # `rust-toolchain.toml` overrides the default for every cargo
          # invocation inside the checkout. `RUSTUP_TOOLCHAIN` is the one
          # override that beats the file.
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libva-dev libpipewire-0.3-dev libegl-dev libgbm-dev libwayland-dev libxkbcommon-dev libvulkan-dev spirv-tools
      - uses: Swatinem/rust-cache@v2
      # Proof in the log that the floor is what compiled, so a later change to
      # the pin or the action cannot quietly make this a second stable run.
      - name: Show the toolchain this job builds with
        run: rustc --version && cargo --version
      # The shipped artifact is what MSRV bounds: dev-dependencies may
      # legitimately require newer, so check the package targets only.
      - run: cargo check --locked

  result:
    # The single check the `main` ruleset requires: it passes when every
    # job passed or was skipped (release-plz bump pull requests skip all).
    name: CI result
    if: always()
    needs: [bump, check, msrv]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "job results: $RESULTS"
          if [ "$FAILED" = "true" ]; then
            echo "::error::one or more jobs failed or were cancelled"
            exit 1
          fi
