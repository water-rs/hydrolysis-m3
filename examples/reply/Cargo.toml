# This example roots its own workspace: the managed Hydrolysis backend
# resolves `hydrolysis-m3` from the registry release, so the app must resolve
# the same package instance for theme types (`MaterialColorScheme`,
# `MaterialTheme`) to be shared rather than duplicated.
[workspace]

[package]
name = "reply-example"
version = "0.1.0"
edition = "2024"
authors = ["Lexo Liu"]
description = "Material 3 list-detail mail client for WaterUI"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
waterui = "0.4.1"
waterui-icons-material-icon = "0.1.2"
hydrolysis-m3 = "0.2.0"

[dev-dependencies]
waterui-testing = "0.4.1"

# The framework's own third-party forks, mirrored from the root manifest so a
# standalone `cargo build` here resolves the same sources the workspace does.
[patch.crates-io]
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
vello = { git = "https://github.com/lexoliu/vello", rev = "5e5f538556be16527f67379b105af82f408b747d" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
