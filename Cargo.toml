[workspace]
resolver = "2"

[package]
name = "hydrolysis-m3"
version = "0.2.1"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.95"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/water-rs/hydrolysis-m3"
description = "Material 3 widget theme for WaterUI self-drawn backends"
keywords = ["ui", "theme", "material", "waterui", "graphics"]
categories = ["gui"]

[dependencies]
material-color-utils = { version = "0.1.3", default-features = false }
num-traits = { version = "0.2", default-features = false }
vello = "0.9"
waterui = { version = "0.4.0", default-features = false, features = ["snackbar"] }
waterui-backend-core = { version = "0.1.1", default-features = false, features = ["widgets", "gestures"] }
waterui-core = "0.3.1"
waterui-controls = "0.3.1"
waterui-form = "0.3.1"
waterui-graphics = { version = "0.4.0", default-features = false, features = ["gpu"] }

[dev-dependencies]
pollster = "1.0"
# The theme itself draws into the scene directly; only the shape gallery test
# authors a canvas.
waterui-canvas = "0.1.2"
waterui-testing = "0.4.0"

[package.metadata.waterui.assets]

[[package.metadata.waterui.assets.font]]
name = "Roboto"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK JP"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/06_NotoSansCJKjp.zip"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK KR"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/07_NotoSansCJKkr.zip"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK SC"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/08_NotoSansCJKsc.zip"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK TC"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/09_NotoSansCJKtc.zip"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

# The WaterUI packages above come from crates.io, so this repository builds
# against the same released APIs its users get. The third-party pins below are
# the framework's own: the published framework crates were built with these
# forks, and dropping them here would run this repository's render tests
# through different code than the framework runs.
[patch.crates-io]
# `DrawContext::draw_shadow` (water-rs/waterui#628) ships with the next
# `waterui-backend-core` release; until it lands on crates.io the framework
# crates resolve from the contract branch. Every `waterui-*` member of that
# repository is pinned to the same revision so the graph carries exactly one
# copy of each — a registry crate beside its git twin would compile duplicate
# `View`/`Resolvable` types. `hydrolysis` resolves from the branch that
# implements the primitive (water-rs/hydrolysis#14). Drop the entries and
# bump the requirements once the releases carry them.
waterui = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-str = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "8af2dd01bb21ac81cd5b9fcacb37e8ec05b98ccf" }
hydrolysis = { git = "https://github.com/water-rs/hydrolysis", rev = "e0cab32d0302877bbc9852cf504538fcf1534cb7" }
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
vello = { git = "https://github.com/lexoliu/vello", rev = "5e5f538556be16527f67379b105af82f408b747d" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }

# `waterui-testing` depends on this crate, so a test graph that took it from
# the registry would link two `hydrolysis-m3` copies and hand the harness a
# theme of the wrong type. Redirect the registry copy at the one being built.
hydrolysis-m3 = { path = "." }

