[workspace]
resolver = "2"

[package]
name = "hydrolysis-m3"
version = "0.3.0"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.95"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/water-rs/hydrolysis-m3"
description = "Material 3 widget theme for WaterUI self-drawn backends"
keywords = ["ui", "theme", "material", "waterui", "graphics"]
categories = ["gui"]

[dependencies]
hydrolysis = "0.3.0"
material-color-utils = { version = "0.1.3", default-features = false }
num-traits = { version = "0.2", default-features = false }
vello = "0.9"
waterui = { version = "0.5.0", default-features = false, features = ["snackbar", "media", "highlight"] }
waterui-backend-core = { version = "0.5.0", default-features = false, features = ["widgets", "gestures"] }
waterui-core = "0.5.0"
waterui-controls = "0.5.0"
waterui-form = "0.5.0"
waterui-graphics = { version = "0.5.0", default-features = false, features = ["gpu"] }

[dev-dependencies]
pollster = "1.0"
# Writes the test portrait the avatar visual acceptance renders. PNG only:
# the encoder is all these tests need.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# The theme itself draws into the scene directly; only the shape gallery test
# authors a canvas.
waterui-canvas = "0.2.0"
waterui-inspector-app = "0.5.0"
waterui-navigation = "0.5.0"
waterui-testing = "0.5.0"

[package.metadata.waterui.assets]

[[package.metadata.waterui.assets.font]]
name = "Roboto"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK JP"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/06_NotoSansCJKjp.zip"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK KR"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/07_NotoSansCJKkr.zip"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK SC"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/08_NotoSansCJKsc.zip"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK TC"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/09_NotoSansCJKtc.zip"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui `dev`.
[patch.crates-io]
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
vello = { git = "https://github.com/lexoliu/vello", rev = "5e5f538556be16527f67379b105af82f408b747d" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
