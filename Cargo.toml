[workspace]
resolver = "2"

[package]
name = "hydrolysis-m3"
version = "0.1.0"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.95"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/water-rs/hydrolysis-m3"
description = "Material 3 widget theme for WaterUI self-drawn backends"
keywords = ["ui", "theme", "material", "waterui", "graphics"]
categories = ["gui"]

[dependencies]
material-color-utils = { version = "0.1.3", default-features = false }
num-traits = { version = "0.2", default-features = false }
vello = "0.9"
waterui = { version = "0.3.0", default-features = false, features = ["snackbar"] }
waterui-backend-core = { version = "0.1.0", default-features = false, features = ["widgets", "gestures"] }
waterui-core = "0.3.0"
waterui-controls = "0.3.0"
waterui-form = "0.3.0"
waterui-graphics = { version = "0.3.0", default-features = false, features = ["gpu"] }

[dev-dependencies]
pollster = "1.0"
# The theme itself draws into the scene directly; only the shape gallery test
# authors a canvas.
waterui-canvas = "0.1.1"
waterui-testing = "0.3.0"

[package.metadata.waterui.assets]

[[package.metadata.waterui.assets.font]]
name = "Roboto"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK JP"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/06_NotoSansCJKjp.zip"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK KR"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/07_NotoSansCJKkr.zip"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK SC"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/08_NotoSansCJKsc.zip"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK TC"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/09_NotoSansCJKtc.zip"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

# Development and CI certify one immutable WaterUI foundation revision: every
# framework package in the graph, Hydrolysis included, comes from the same commit.
# The published requirements above remain the distribution contract; Cargo only
# applies patches from the consuming graph's root manifest.
[patch.crates-io]
hydrolysis = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
waterui = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
waterui-assets = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
waterui-controls = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
waterui-core = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
waterui-dylib = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
waterui-form = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
waterui-graphics = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
waterui-icon = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
waterui-internal = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
