waterui-macros = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
waterui-map = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
waterui-media = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
