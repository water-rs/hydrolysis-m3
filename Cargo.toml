[workspace]
resolver = "2"

[package]
name = "hydrolysis-m3"
version = "0.3.1"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.95"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/water-rs/hydrolysis-m3"
description = "Material 3 widget theme for WaterUI self-drawn backends"
keywords = ["ui", "theme", "material", "waterui", "graphics"]
categories = ["gui"]

[dependencies]
hydrolysis = "0.3.1"
material-color-utils = { version = "0.1.3", default-features = false }
num-traits = { version = "0.2", default-features = false }
waterui = { version = "0.5.2", default-features = false, features = ["snackbar", "media", "highlight"] }
waterui-backend-core = { version = "0.5.2", default-features = false, features = ["widgets", "gestures"] }
waterui-core = "0.5.1"
waterui-controls = "0.5.1"
waterui-form = "0.5.1"
waterui-graphics = { version = "0.5.1", default-features = false }
cherenkov = "0.0.0"

[dev-dependencies]
pollster = "1.0"
# Writes the test portrait the avatar visual acceptance renders. PNG only:
# the encoder is all these tests need.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# The theme itself draws into the scene directly; only the shape gallery test
# authors a canvas.
waterui-canvas = "0.2.0"
# nami `Signal::get` was renamed to `snapshot` in 0.11.2/5dc2d92e; waterkit
# consumers of `Subscribed` need the migrated source too.
waterkit-core = "0.1.4"
waterui-inspector-app = "0.5.2"
waterui-navigation = "0.5.1"
waterui-testing = "0.5.1"

[package.metadata.waterui.assets]

# Material's typeface ships in-tree: the theme renders in Roboto on a machine
# that has never seen it, offline, with no font of that name installed. The
# variable build carries the whole weight axis, so the type scale's Regular
# and Medium are real instances rather than synthesised weights.
# `assets/fonts/README.md` records its provenance and its OFL-1.1 licence.
[[package.metadata.waterui.assets.font]]
name = "Roboto"
local_path = "assets/fonts/Roboto-Variable.ttf"

# CJK, Arabic, Hebrew and every other script Roboto does not cover are the
# application's declaration, not the theme's: the face an app needs depends on
# the languages it serves, and the four Noto Sans CJK archives are ~20 MB each
# with at most one of them ever right. An app names the face it wants in its
# own `Water.toml`, which is the one place a project can actually reach:
#
#     [[assets.font]]
#     name = "Noto Sans CJK SC"
#
# The CLI's font registry knows those names; the file has to be in the local
# font cache, because a build never downloads one.

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui at `4dacae48`.
[patch.crates-io]
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }

# The in-tree Cherenkov revision (water-rs/waterui#1449): `SceneContent`
# requires `rebuild_for_engine`, the contract this branch implements.
# Cherenkov, filtrate and hydrolysis live in that repository — the engine
# family under `graphics/` and the backend under `backends/hydrolysis` — so
# their requirements resolve there too. Every framework crate in the graph
# comes from the same revision so the graph holds one copy of each; drop
# these entries once the framework ships on crates.io.
