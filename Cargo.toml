waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }

# Component crates living in their own repositories, each at the rev
# water-rs/waterui's own patch table pins.
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "16f99e021f735d0b1b31c95552b074e953d56418" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
# `hydrolysis` moved into water-rs/waterui at `backends/hydrolysis` and
# resolves to the same revision as the rest of the framework.
hydrolysis = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }


# The engine and its filter crates live in the waterui repository under
# `graphics/` and resolve to the same revision as the rest of the graph:
# every cherenkov/filtrate name in the graph must come from it or a
# filter/recorder type splits into two copies.
cherenkov = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
cherenkov-gpu = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
filtrate = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
filtrate-core = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
filtrate-derive = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }

# wgpu 30.0.1's Metal backend reads the address of the kCGColorSpace* globals
# instead of their value and crashes in CGColorSpaceCreateWithName whenever a
# surface negotiates Extended Display P3 or BT.2100 (gfx-rs/wgpu#10175, fixed on
# trunk, not yet released for v30). Mirrored from water-rs/waterui's own
# workspace patch at the pinned revision: `[patch]` in a dependency's manifest
# does not apply downstream, so without these entries this graph resolves the
# crashing crates.io build while cherenkov resolves the fork. Drop them once
# wgpu-hal 30.0.2 ships the backport.
naga = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
