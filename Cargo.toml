[workspace]
resolver = "2"

[package]
name = "hydrolysis-m3"
version = "0.3.1"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.95"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/water-rs/hydrolysis-m3"
description = "Material 3 widget theme for WaterUI self-drawn backends"
keywords = ["ui", "theme", "material", "waterui", "graphics"]
categories = ["gui"]

[dependencies]
hydrolysis = "0.3.1"
material-color-utils = { version = "0.1.3", default-features = false }
num-traits = { version = "0.2", default-features = false }
waterui = { version = "0.5.2", default-features = false, features = ["snackbar", "media", "highlight"] }
waterui-backend-core = { version = "0.5.2", default-features = false, features = ["widgets", "gestures"] }
waterui-core = "0.5.1"
waterui-controls = "0.5.1"
waterui-form = "0.5.1"
waterui-graphics = { version = "0.5.1", default-features = false }
cherenkov = { git = "https://github.com/water-rs/cherenkov", rev = "a7708216db67bbf976e1fe36429a6a54cf82ba8a" }

[dev-dependencies]
pollster = "1.0"
# Writes the test portrait the avatar visual acceptance renders. PNG only:
# the encoder is all these tests need.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# The theme itself draws into the scene directly; only the shape gallery test
# authors a canvas.
waterui-canvas = "0.2.0"
# nami `Signal::get` was renamed to `snapshot` in 0.11.2/5dc2d92e; waterkit
# consumers of `Subscribed` need the migrated source too.
waterkit-core = "0.1.4"
waterui-inspector-app = "0.5.2"
waterui-navigation = "0.5.1"
waterui-testing = "0.5.1"

[package.metadata.waterui.assets]

# Material's typeface ships in-tree: the theme renders in Roboto on a machine
# that has never seen it, offline, with no font of that name installed. The
# variable build carries the whole weight axis, so the type scale's Regular
# and Medium are real instances rather than synthesised weights.
# `assets/fonts/README.md` records its provenance and its OFL-1.1 licence.
[[package.metadata.waterui.assets.font]]
name = "Roboto"
local_path = "assets/fonts/Roboto-Variable.ttf"

# CJK, Arabic, Hebrew and every other script Roboto does not cover are the
# application's declaration, not the theme's: the face an app needs depends on
# the languages it serves, and the four Noto Sans CJK archives are ~20 MB each
# with at most one of them ever right. An app names the face it wants in its
# own `Water.toml`, which is the one place a project can actually reach:
#
#     [[assets.font]]
#     name = "Noto Sans CJK SC"
#
# The CLI's font registry knows those names; the file has to be in the local
# font cache, because a build never downloads one.

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui `dev`.
[patch.crates-io]
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }

# `WidgetTheme::icon_button_metrics`, the `icon_only` chrome flag and
# `Label::effective_display_mode` exist only at this `dev` revision; drop
# these entries once backend-core ships them on crates.io. Every framework
# crate in the graph comes from the same revision so the graph holds one
# copy of each.
waterui = { path = "../waterui" }
waterui-assets = { path = "../waterui/components/assets/runtime" }
waterui-assets-core = { path = "../waterui/components/assets/core" }
waterui-assets-macros = { path = "../waterui/components/assets/macros" }
waterui-assets-planner = { path = "../waterui/components/assets/planner" }
waterui-backend-core = { path = "../waterui/backends/core" }
waterui-controls = { path = "../waterui/components/foundation/controls" }
waterui-core = { path = "../waterui/core" }
waterui-form = { path = "../waterui/components/foundation/form" }
waterui-graphics = { path = "../waterui/components/visual/graphics" }
waterui-icon = { path = "../waterui/components/foundation/icon" }
waterui-icons-codegen = { path = "../waterui/components/icon/codegen" }
waterui-icons-lucide = { path = "../waterui/components/icon/lucide" }
waterui-inspector-app = { path = "../waterui/components/devtools/inspector/app" }
waterui-inspector-protocol = { path = "../waterui/components/devtools/inspector/protocol" }
waterui-internal = { path = "../waterui/src" }
waterui-layout = { path = "../waterui/components/foundation/layout" }
waterui-locale = { path = "../waterui/utils/locale" }
waterui-macros = { path = "../waterui/macros" }
waterui-map = { path = "../waterui/components/data/map" }
waterui-media = { path = "../waterui/components/multimedia/media" }
waterui-navigation = { path = "../waterui/components/foundation/navigation" }
waterui-preview-protocol = { path = "../waterui/components/devtools/preview/protocol" }
waterui-shape = { path = "../waterui/components/foundation/shape" }
waterui-testing = { path = "../waterui/testing" }
waterui-text = { path = "../waterui/components/foundation/text" }
waterui-url = { path = "../waterui/utils/url" }
waterui-video = { path = "../waterui/components/multimedia/video" }
waterui-dylib = { path = "../waterui/utils/dylib" }
waterui-mcp = { path = "../waterui/components/devtools/mcp/server" }
waterui-mcp-protocol = { path = "../waterui/components/devtools/mcp/protocol" }
waterui-watcher-set = { path = "../waterui/utils/watcher-set" }

# Component crates living in their own repositories, pinned to the cutover
# revisions the hydrolysis deliverable resolves.
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "16362805a6babc99a8937a1b75f2ccb831e93f43" }
waterui-barcode = { git = "https://github.com/water-rs/barcode", rev = "4c530503f6e3277f44511f327db463a195482abd" }
waterui-particle = { git = "https://github.com/water-rs/particle", rev = "e27ae84666ee58c2ff4adae16d9227baf7efc3f2" }
waterui-map-gpu = { git = "https://github.com/water-rs/map-gpu", rev = "14243cb70ddee64275d1c20d9f2019c8c3d25ae4" }
# waterui-video-gpu is being ported on water-rs/video-gpu
# `feat/cherenkov-port` by a dedicated session; the interim local checkout
# exists only until that rev lands.
waterui-video-gpu = { path = "../video-gpu" }
waterui-webview = { path = "../waterui/components/platform/webview" }

# The cutover hydrolysis is not on any public branch yet; the backend
# resolves it from the sibling checkout (the deliverable bundles carry both).
hydrolysis = { path = "../hydrolysis" }

# This is the revision waterui's `feat/cherenkov-cutover-w` root pins
# (water-rs/waterui#1246); every cherenkov/filtrate name in the graph must
# come from it or a filter/recorder type splits into two copies.
cherenkov = { git = "https://github.com/water-rs/cherenkov", rev = "a7708216db67bbf976e1fe36429a6a54cf82ba8a" }
cherenkov-cpu = { git = "https://github.com/water-rs/cherenkov", rev = "a7708216db67bbf976e1fe36429a6a54cf82ba8a" }
