# `waterui-testing` carries this theme as its default; inside the pinned
# framework checkout that is a path dependency, so it is redirected to this
# crate rather than linking a second copy.
[patch."https://github.com/water-rs/waterui.git"]
hydrolysis-m3 = { path = "." }
