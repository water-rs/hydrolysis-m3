[workspace]
resolver = "2"

[package]
name = "hydrolysis-m3"
version = "0.2.0"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.95"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/water-rs/hydrolysis-m3"
description = "Material 3 widget theme for WaterUI self-drawn backends"
keywords = ["ui", "theme", "material", "waterui", "graphics"]
categories = ["gui"]

[dependencies]
material-color-utils = { version = "0.1.3", default-features = false }
num-traits = { version = "0.2", default-features = false }
vello = "0.9"
waterui = { version = "0.4.0", default-features = false, features = ["snackbar"] }
waterui-backend-core = { version = "0.1.1", default-features = false, features = ["widgets", "gestures"] }
waterui-core = "0.3.1"
waterui-controls = "0.3.1"
waterui-form = "0.3.1"
waterui-graphics = { version = "0.4.0", default-features = false, features = ["gpu"] }

[dev-dependencies]
pollster = "1.0"
# The theme itself draws into the scene directly; only the shape gallery test
# authors a canvas.
waterui-canvas = "0.1.2"
waterui-testing = "0.4.0"

[package.metadata.waterui.assets]

[[package.metadata.waterui.assets.font]]
name = "Roboto"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK JP"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/06_NotoSansCJKjp.zip"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK KR"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/07_NotoSansCJKkr.zip"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK SC"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/08_NotoSansCJKsc.zip"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK TC"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/09_NotoSansCJKtc.zip"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

# The WaterUI packages above come from crates.io, so this repository builds
# against the same released APIs its users get. The third-party pins below are
# the framework's own: the published framework crates were built with these
# forks, and dropping them here would run this repository's render tests
# through different code than the framework runs.
[patch.crates-io]
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
vello = { git = "https://github.com/lexoliu/vello", rev = "5e5f538556be16527f67379b105af82f408b747d" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }

# `waterui-testing` depends on this crate, so a test graph that took it from
# the registry would link two `hydrolysis-m3` copies and hand the harness a
# theme of the wrong type. Redirect the registry copy at the one being built.
hydrolysis-m3 = { path = "." }
