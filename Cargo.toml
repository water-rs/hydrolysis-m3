[workspace]
resolver = "2"

[package]
name = "hydrolysis-m3"
version = "0.3.1"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.95"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/water-rs/hydrolysis-m3"
description = "Material 3 widget theme for WaterUI self-drawn backends"
keywords = ["ui", "theme", "material", "waterui", "graphics"]
categories = ["gui"]

[dependencies]
hydrolysis = { version = "0.3.1", default-features = false }
material-color-utils = { version = "0.1.3", default-features = false }
num-traits = { version = "0.2", default-features = false }
waterui = { version = "0.5.2", default-features = false, features = ["snackbar", "media", "highlight"] }
waterui-backend-core = { version = "0.5.2", default-features = false, features = ["widgets", "gestures"] }
waterui-core = "0.5.1"
waterui-controls = "0.5.1"
waterui-form = "0.5.1"
waterui-graphics = { version = "0.5.1", default-features = false }

[dev-dependencies]
# The tests render through hydrolysis's default Cherenkov painter.
hydrolysis = "0.3.1"
pollster = "1.0"
# Writes the test portrait the avatar visual acceptance renders. PNG only:
# the encoder is all these tests need.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Per-frame gesture observations in the touch-scroll tests go through the
# diagnostics channel, not stdout.
tracing = "0.1"
# The theme itself draws into the scene directly; only the shape gallery test
# authors a canvas.
waterui-canvas = "0.2.0"
# nami 0.12 renamed `Signal::get` to `snapshot`; waterkit consumers of
# `Subscribed` need the migrated source too.
waterkit-core = "0.1.4"
# `material_ripple_visual_snapshot` mounts a GPU scene surface through
# hydrolysis and stamps its render with `waterui_graphics::cherenkov::FrameTime`,
# so the test build asks for the graphics crate's `cherenkov` feature — the
# engine re-export only — even though the theme itself records only.
waterui-graphics = { version = "0.5.1", default-features = false, features = ["cherenkov"] }
waterui-inspector-app = "0.5.2"
waterui-navigation = "0.5.1"
waterui-testing = "0.5.1"

[package.metadata.waterui.assets]

# Material's typeface ships in-tree: the theme renders in Roboto on a machine
# that has never seen it, offline, with no font of that name installed. The
# variable build carries the whole weight axis, so the type scale's Regular
# and Medium are real instances rather than synthesised weights.
# `assets/fonts/README.md` records its provenance and its OFL-1.1 licence.
[[package.metadata.waterui.assets.font]]
name = "Roboto"
local_path = "assets/fonts/Roboto-Variable.ttf"

# CJK, Arabic, Hebrew and every other script Roboto does not cover are the
# application's declaration, not the theme's: the face an app needs depends on
# the languages it serves, and the four Noto Sans CJK archives are ~20 MB each
# with at most one of them ever right. An app names the face it wants in its
# own `Water.toml`, which is the one place a project can actually reach:
#
#     [[assets.font]]
#     name = "Noto Sans CJK SC"
#
# The CLI's font registry knows those names; the file has to be in the local
# font cache, because a build never downloads one.

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui at `98b0bc7de`.
[patch.crates-io]

# The render-target-neutral recording contract (water-rs/waterui#1435):
# `SceneContent::build_scene` records into `waterui_graphics::draw`
# (`cherenkov_record::Recorder`) and `SceneResources::new` takes the target's
# `SceneBackend`/`ShaderBackend` registry. Cherenkov, filtrate and hydrolysis
# live in that repository — the engine family under `graphics/` and the
# backend under `backends/hydrolysis` — so their requirements resolve there
# too. Every framework crate in the graph comes from the same revision so
# the graph holds one copy of each; drop these entries once the framework
# ships on crates.io.
#
# The revision is water-rs/waterui `98b0bc7de`, the merge of #1402 — the
# view-transition work (#1387) this backend's per-presentation overlay
# builder and test-reception requirements landed on. It sits on `dev`.
waterui = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-icons-codegen = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-icons-lucide = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-inspector-app = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "98b0bc7de80182c93ee2361d7c41a21d4cd53584" }
