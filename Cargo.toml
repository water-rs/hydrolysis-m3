[workspace]
resolver = "2"

[package]
name = "hydrolysis-m3"
version = "0.3.1"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.99"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/water-rs/hydrolysis-m3"
description = "Material 3 widget theme for WaterUI self-drawn backends"
keywords = ["ui", "theme", "material", "waterui", "graphics"]
categories = ["gui"]

[dependencies]
hydrolysis = { version = "0.3.1", default-features = false }
material-color-utils = { version = "0.1.3", default-features = false }
num-traits = { version = "0.2", default-features = false }
waterui = { version = "0.5.2", default-features = false, features = ["snackbar", "media", "highlight"] }
waterui-core = "0.5.1"
waterui-controls = "0.5.1"
waterui-form = "0.5.1"
waterui-graphics = { version = "0.5.1", default-features = false }

[dev-dependencies]
# The tests render through hydrolysis's default Cherenkov painter.
hydrolysis = "0.3.1"
pollster = "1.0"
# Writes the test portrait the avatar visual acceptance renders. PNG only:
# the encoder is all these tests need.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Per-frame gesture observations in the touch-scroll tests go through the
# diagnostics channel, not stdout.
tracing = "0.1"
# The theme itself draws into the scene directly; only the shape gallery test
# authors a canvas.
waterui-canvas = "0.2.0"
# nami 0.12 renamed `Signal::get` to `snapshot`; waterkit consumers of
# `Subscribed` need the migrated source too.
waterkit-core = "0.1.4"
waterui-inspector-app = "0.5.2"
waterui-navigation = "0.5.1"
waterui-testing = "0.5.1"

[package.metadata.waterui.assets]

# Material's typeface ships in-tree: the theme renders in Roboto on a machine
# that has never seen it, offline, with no font of that name installed. The
# variable build carries the whole weight axis, so the type scale's Regular
# and Medium are real instances rather than synthesised weights.
# `assets/fonts/README.md` records its provenance and its OFL-1.1 licence.
[[package.metadata.waterui.assets.font]]
name = "Roboto"
local_path = "assets/fonts/Roboto-Variable.ttf"

# CJK, Arabic, Hebrew and every other script Roboto does not cover are the
# application's declaration, not the theme's: the face an app needs depends on
# the languages it serves, and the four Noto Sans CJK archives are ~20 MB each
# with at most one of them ever right. An app names the face it wants in its
# own `Water.toml`, which is the one place a project can actually reach:
#
#     [[assets.font]]
#     name = "Noto Sans CJK SC"
#
# The CLI's font registry knows those names; the file has to be in the local
# font cache, because a build never downloads one.

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui at `30d47d914`.
[patch.crates-io]

# The render-target-neutral recording contract (water-rs/waterui#1435):
# `SceneContent::build_scene` records into `waterui_graphics::draw`
# (`cherenkov_record::Recorder`) and `SceneResources::new` takes the target's
# `SceneBackend`/`ShaderBackend` registry. Cherenkov, filtrate and hydrolysis
# live in that repository — the engine family under `graphics/` and the
# backend under `backends/hydrolysis` — so their requirements resolve there
# too. Every framework crate in the graph comes from the same revision so
# the graph holds one copy of each; drop these entries once the framework
# ships on crates.io.
#
# Temporary: pinned to water-rs/waterui's fix/3711-tab-indicator-style; returns to `dev` once that PR merges.
# The `dev` branch of water-rs/waterui otherwise; the exact commit is recorded by the
# committed `Cargo.lock`.
waterui = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-assets = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-controls = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-core = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-form = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-icon = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-icons-codegen = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-icons-lucide = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-inspector-app = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-internal = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-layout = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-locale = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-macros = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-map = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-media = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-shape = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-testing = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-text = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-url = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }

# Component crates living in their own repositories, each at the rev
# water-rs/waterui's own patch table pins.
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "16f99e021f735d0b1b31c95552b074e953d56418" }
waterui-webview = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
# `hydrolysis` moved into water-rs/waterui at `backends/hydrolysis` and
# resolves to the same revision as the rest of the framework.
hydrolysis = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }


# The engine and its filter crates live in the waterui repository under
# `graphics/` and resolve to the same revision as the rest of the graph:
# every cherenkov/filtrate name in the graph must come from it or a
# filter/recorder type splits into two copies.
cherenkov = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
cherenkov-gpu = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
filtrate = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
filtrate-core = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }
filtrate-derive = { git = "https://github.com/water-rs/waterui", branch = "fix/3711-tab-indicator-style" }

# wgpu 30.0.1's Metal backend reads the address of the kCGColorSpace* globals
# instead of their value and crashes in CGColorSpaceCreateWithName whenever a
# surface negotiates Extended Display P3 or BT.2100 (gfx-rs/wgpu#10175, fixed on
# trunk, not yet released for v30). Mirrored from water-rs/waterui's own
# workspace patch at the pinned revision: `[patch]` in a dependency's manifest
# does not apply downstream, so without these entries this graph resolves the
# crashing crates.io build while cherenkov resolves the fork. Drop them once
# wgpu-hal 30.0.2 ships the backport.
shaderloom = { git = "https://github.com/water-rs/shaderloom", branch = "dev" }
naga = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
naga-types = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
wgpu = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
wgpu-core = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
wgpu-core-deps-apple = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
wgpu-core-deps-emscripten = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
wgpu-hal = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
wgpu-naga-bridge = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
wgpu-types = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }

waterui-canvas = { git = "https://github.com/water-rs/canvas", branch = "dev" }
waterui-image = { git = "https://github.com/water-rs/image", branch = "dev" }
waterui-chart = { git = "https://github.com/water-rs/chart", branch = "dev" }
waterkit-build = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-clipboard = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-codec = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-core = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-location = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
# Unreleased, so there is no registry version to resolve: the patch tracks
# waterkit's `dev`, which carries the crate (water-rs/waterkit#223), like the
# rest of the family. Drop it once a release exists.
waterkit-permission = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video-core = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
# suiteki 0.1.1 on crates.io implements nami-core 0.3's `Signal`; `dev`
# implements the current nami-core's, keeping this graph on one `Signal` trait.
# Drop once a release carries it.
suiteki = { git = "https://github.com/water-rs/suiteki", branch = "dev" }
