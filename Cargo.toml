[workspace]
resolver = "2"

[package]
name = "hydrolysis-m3"
version = "0.3.0"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.95"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/water-rs/hydrolysis-m3"
description = "Material 3 widget theme for WaterUI self-drawn backends"
keywords = ["ui", "theme", "material", "waterui", "graphics"]
categories = ["gui"]

[dependencies]
hydrolysis = "0.3.0"
material-color-utils = { version = "0.1.3", default-features = false }
num-traits = { version = "0.2", default-features = false }
vello = "0.9"
waterui = { version = "0.4.1", default-features = false, features = ["snackbar", "media", "highlight"] }
waterui-backend-core = { version = "0.1.2", default-features = false, features = ["widgets", "gestures"] }
waterui-core = "0.3.2"
waterui-controls = "0.3.2"
waterui-form = "0.3.2"
waterui-graphics = { version = "0.4.1", default-features = false, features = ["gpu"] }

[dev-dependencies]
pollster = "1.0"
# Writes the test portrait the avatar visual acceptance renders. PNG only:
# the encoder is all these tests need.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# The theme itself draws into the scene directly; only the shape gallery test
# authors a canvas.
waterui-canvas = "0.2.0"
waterui-inspector-app = "0.1.2"
waterui-navigation = "0.3.2"
waterui-testing = "0.4.1"

[package.metadata.waterui.assets]

[[package.metadata.waterui.assets.font]]
name = "Roboto"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK JP"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/06_NotoSansCJKjp.zip"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK KR"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/07_NotoSansCJKkr.zip"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK SC"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/08_NotoSansCJKsc.zip"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK TC"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/09_NotoSansCJKtc.zip"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

# The WaterUI packages above come from crates.io, so this repository builds
# against the same released APIs its users get. The third-party pins below are
# the framework's own: the published framework crates were built with these
# forks, and dropping them here would run this repository's render tests
# through different code than the framework runs.
[patch.crates-io]
waterui-image = { git = "https://github.com/water-rs/image", rev = "a1632420ddecde008bde3fe392eee0d9f660d67a" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "79493d096341faf630e03350f22db73c07bb3b3a" }
# waterui 0.5.0 is not on crates.io yet; the `dev` revision below is the
# release-candidate head release-plz will publish. Every `waterui-*` member of that
# repository is pinned to the same revision so the graph carries exactly one
# copy of each — a registry crate beside its git twin would compile duplicate
# `View`/`Resolvable` types. `hydrolysis` and `waterui-canvas` are satellites
# of the same wave and pin their `dev` HEADs. Drop the entries and bump the
# requirements once the releases carry them.
waterui = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-icons-codegen = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-icons-lucide = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-inspector-app = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "201ba5ba953a9330671d92e91a14967c24cfc8af" }
